<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="login_page_title">Login - Taoyuan Sharing</title>
  <meta name="description" content="Log in to Taoyuan Sharing Community." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Navbar -->
  <header id="navbar">
    <a href="index.html" class="brand">🌱 <span data-i18n="site_title">Taoyuan Sharing Community</span></a>

    <nav id="navbar-right">
      <a href="index.html" class="nav-link" data-i18n="home">Home</a>
      <div id="nav-auth">
        <a href="login.html" class="nav-btn nav-btn-ghost" aria-current="page" data-i18n="login">Login</a>
        <a href="register.html" class="nav-btn" data-i18n="register">Register</a>
      </div>

      <div id="language-switcher" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="zh">中文</button>
      </div>
    </nav>
  </header>

  <main class="auth-container">
    <h1 data-i18n="login_heading">Login</h1>

    <form id="login-form" class="auth-form">
      <label for="login-email" data-i18n="login_email_label">Email</label>
      <input type="email" id="login-email" required autocomplete="email" />

      <label for="login-password" data-i18n="login_password_label">Password</label>
      <input type="password" id="login-password" required autocomplete="current-password" />

      <p id="form-message" class="form-message" role="status" aria-live="polite"></p>

      <button type="submit" class="auth-btn" data-i18n="login_button">Login</button>
    </form>

    <p class="demo-notice" data-i18n="demo_notice">Demo mode: accounts are saved only in this browser.</p>

    <p>
      <span data-i18n="login_no_account">Don’t have an account?</span>
      <a href="register.html" data-i18n="go_register">Register here</a>
    </p>
    <p><a href="index.html" data-i18n="back_home">← Back to Home</a></p>
  </main>

  <script src="i18n.js"></script>
  <script src="auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
